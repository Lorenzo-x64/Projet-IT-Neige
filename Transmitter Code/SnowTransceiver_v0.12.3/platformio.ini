; ============================================================================
;  Snow Transceiver  --  PlatformIO project configuration
;  Target board: uPesy ESP32 WROOM 32E Low-Power (4MB flash)
;  Author      : Generated for the Snow Transceiver project
; ============================================================================
;
;  Build & upload firmware:        pio run -t upload
;  Build & upload web UI files:    pio run -t uploadfs
;  Open serial monitor:            pio device monitor
;  Build flags:                    -D DEBUG_SNOW=1 enables verbose Serial logs
;
;  IMPORTANT: After flashing the firmware ONCE, also run `pio run -t uploadfs`
;  to push the contents of /data into LittleFS. Without this the dashboard
;  cannot load.
; ============================================================================

[env:upesy_wroom]
platform        = espressif32 @ ^6.9.0
board           = upesy_wroom
framework       = arduino

; --- Serial / monitor ----------------------------------------------------
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; --- Filesystem ----------------------------------------------------------
; LittleFS is faster, safer on power-loss, supports real directories,
; and is the recommended choice over SPIFFS on ESP32 in 2026.
board_build.filesystem  = littlefs
board_build.partitions  = default.csv     ; 1.2MB app / 1.5MB FS / 1.5MB OTA

; --- Build flags ---------------------------------------------------------
build_flags =
    -D CORE_DEBUG_LEVEL=2
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=128
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1

; --- Library dependencies (pinned for reproducible builds) ---------------
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ESP32Async/AsyncTCP          @ ^3.3.2
    bblanchon/ArduinoJson        @ ^7.2.0
    mikalhart/TinyGPSPlus        @ ^1.1.0
    plerup/EspSoftwareSerial     @ ^8.2.0
    ; The hanyazou BMI160 library is the one your test sketch used (header
    ; <BMI160Gen.h>, class BMI160GenClass).  PlatformIO's registry alias for
    ; it has changed several times, so we pull straight from GitHub by URL --
    ; this is the same source the Arduino IDE installs.
    https://github.com/hanyazou/BMI160-Arduino.git

; --- Pre-build cleanup ---------------------------------------------------
; The hanyazou library bundles internal/ss_spi_101.cpp -- an Arduino 101
; (Intel Curie) specific SPI shim that #includes <eiaextensions.h> from the
; Curie toolchain.  That file is harmless on Arduino IDE (the IDE lazily
; skips it for non-Curie targets) but PIO compiles every .cpp it finds.
; This script deletes the offending file the first time it sees it.
extra_scripts =
    pre:tools/strip_bmi160_curie.py
;
; UART map (ESP32 has 3 hardware UARTs total):
;   UART0 -> USB / serial monitor
;   UART1 -> LoRa E220 (HardwareSerial(1), bidirectional, needs real FIFO)
;   UART2 -> Ultrasonic A01NYUB (HardwareSerial(2), PRIMARY SENSOR, must be
;            reliable -- HW FIFO is unaffected by WiFi IRQ load)
; The GPS NEO-7M runs on EspSoftwareSerial because we ran out of HW UARTs.
; This is safe for GPS because TinyGPSPlus validates every NMEA sentence
; with a *XX checksum and silently drops bad ones; a missed sentence simply
; means we use the next one ~1 s later. Position is slow-changing and not
; sub-second-critical, so this trade-off costs us nothing in practice.
